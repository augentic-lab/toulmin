[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "toulmin"
version = "0.1.0"
description = "A file-based research workbench with researcher-owned decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1", "ruamel.yaml>=0.18,<0.20"]

[project.scripts]
toulmin = "toulmin.cli.app:app"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/toulmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/toulmin"]
