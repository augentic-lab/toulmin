# Model configuration for `toulmin review` (read-only, headless reviews).
# Model names are plain strings passed to the tool; an empty model uses the tool's own
# default, and the Run then records that the model was not reported. Check each tool's
# current flags before changing extra_args. CLI options override [review] defaults.

[review]
max_runs = 9            # total round cap: 8 reviews + at most 1 synthesis
parallel = 2            # sessions running at the same time
timeout_seconds = 900   # a session still running after this is killed and recorded as failed
personas = ["reviewer-skeptic", "reviewer-industry", "reviewer-theorist", "reviewer-why-not-x"]
models = ["claude", "codex"]

[models.claude]
adapter = "claude-code"  # claude -p, JSON output, no tools, safe mode
model = ""               # e.g. a model name accepted by `claude --model`
# command = "claude"
# extra_args = []

[models.codex]
adapter = "codex"        # codex exec, read-only sandbox, ephemeral
model = ""               # e.g. a model name accepted by `codex exec --model`
# command = "codex"
# extra_args = []
# Codex loads $CODEX_HOME/AGENTS.md (your global instructions) into every session, so
# reviews use a review-only home holding just a login. review checks it before starting
# and refuses a home with AGENTS.md or without a login. Log in once with:
#   mkdir -p ~/.codex-toulmin && CODEX_HOME=~/.codex-toulmin codex login
env = { CODEX_HOME = "~/.codex-toulmin" }

# R11: optional named profiles, with concrete reviewer/synthesis IDs and effort.
# Keep commented until you choose models available to your account. See
# framework/review-profiles.md. No profile or model is silently substituted.
#
# [models.sol]
# adapter = "codex"
# model = "gpt-6.1-sol"
# effort = "high"
# env = { CODEX_HOME = "~/.codex-toulmin" }
# [models.opus]
# adapter = "claude-code"
# model = "claude-opus-5-5"
# effort = "high"
# [models.sonnet]
# adapter = "claude-code"
# model = "claude-sonnet-5-5"
# effort = "medium"
# [profiles.hypothesis]
# description = "Hypothesis-focused; industry and alternatives omitted"
# personas = ["reviewer-skeptic", "reviewer-theorist"]
# models = ["sol", "opus"]
# synthesizer = "sonnet"
# Four reviews + at most one synthesis = FIVE sessions, all covered by max_runs.
# Full four-role coverage with two models is NINE including synthesis; explicitly
# raise max_runs to nine or reduce selection before starting such a combined round.
